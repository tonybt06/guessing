<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#6b4ce6">
  <title>Guess It!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f0e8ff;
      --card: #ffffff;
      --primary: #6b4ce6;
      --primary-dark: #5538c9;
      --correct: #2ecc71;
      --wrong: #ff6b6b;
      --text: #2d2a3e;
      --muted: #6b6880;
      --shadow: 0 8px 24px rgba(107, 76, 230, 0.18);
      --radius: 20px;
      --tap: 56px;
    }

    html {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(165deg, #f0e8ff 0%, #ffe8f5 50%, #e8f4ff 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(1.6rem, 6vw, 2rem);
      text-align: center;
      color: var(--primary);
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
    }

    .stars {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 1.5rem;
      min-height: 1.75rem;
    }

    .star { opacity: 0.25; transition: transform 0.3s, opacity 0.3s; }
    .star.filled { opacity: 1; transform: scale(1.15); }

    main {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      animation: fadeIn 0.35s ease;
    }

    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .clue-text {
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      font-weight: 600;
      line-height: 1.4;
      margin: 0;
    }

    .round-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .choice {
      min-height: 52px;
      padding: 12px 10px;
      border: 3px solid #e8e4f5;
      border-radius: 16px;
      background: #faf9ff;
      font-size: clamp(1rem, 4vw, 1.1rem);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      -webkit-user-select: none;
      user-select: none;
    }

    .choice:active:not(:disabled) { transform: scale(0.96); }

    .choice:disabled { cursor: default; opacity: 0.85; }

    .choice.reveal {
      border-color: var(--correct);
      background: #e8faf0;
    }

    .choice.correct {
      border-color: var(--correct);
      background: #e8faf0;
      animation: pop 0.4s ease;
    }

    .choice.wrong {
      border-color: var(--wrong);
      background: #fff0f0;
      animation: shake 0.45s ease;
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .feedback {
      min-height: 2.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
    }

    .feedback.happy { color: var(--correct); }
    .feedback.try-again { color: var(--wrong); }

    .btn {
      min-height: var(--tap);
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-dark);
      transition: transform 0.1s, box-shadow 0.1s;
      align-self: center;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    .btn-secondary {
      background: #ff85a2;
      box-shadow: 0 6px 0 #e06685;
    }

    .btn-secondary:active { box-shadow: 0 2px 0 #e06685; }

    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: fall 1.2s ease forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .end-emoji {
      font-size: 4rem;
      margin: 0;
    }

    .end-message {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
    }

    .mascot {
      font-size: 4rem;
      margin: 0;
      animation: bounce 1.5s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen, .choice, .mascot, .confetti { animation: none !important; }
    }
  </style>
</head>
<body>
  <h1>Guess It!</h1>
  <p class="subtitle">Solve the riddle — two guesses per round!</p>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main>
    <section class="screen active" id="start-screen">
      <div class="card">
        <p class="mascot" aria-hidden="true">🦊</p>
        <p class="clue-text">Think you can crack these riddles?</p>
        <p class="round-label">8 rounds · 6 choices each · only 2 guesses per round</p>
      </div>
      <button type="button" class="btn" id="start-btn">Let's Play!</button>
    </section>

    <section class="screen" id="game-screen">
      <div class="card">
        <p class="round-label" id="round-label">Round 1 of 5</p>
        <p class="clue-text" id="clue-text"></p>
        <div class="choices" id="choices" role="group" aria-label="Pick your guess"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </div>
      <button type="button" class="btn" id="next-btn" style="display: none;">Next!</button>
    </section>

    <section class="screen" id="end-screen">
      <div class="card">
        <p class="end-emoji" id="end-emoji" aria-hidden="true">🎉</p>
        <p class="end-message" id="end-message"></p>
        <p class="round-label" id="end-score"></p>
      </div>
      <button type="button" class="btn btn-secondary" id="replay-btn">Play Again!</button>
    </section>
  </main>

  <div class="celebration" id="celebration" aria-hidden="true"></div>

  <script>
    const ROUNDS = 8;
    const GUESSES_PER_ROUND = 2;

    const puzzles = [
      { clue: "I have keys but no locks. I have space but no room. You can enter, but you can't go inside.", answer: "keyboard", choices: [
        { id: "keyboard", label: "Keyboard" },
        { id: "piano", label: "Piano" },
        { id: "safe", label: "Safe" },
        { id: "typewriter", label: "Typewriter" },
        { id: "calculator", label: "Calculator" },
        { id: "door", label: "Door" }
      ]},
      { clue: "The more you take, the more you leave behind. What am I?", answer: "footsteps", choices: [
        { id: "footsteps", label: "Footsteps" },
        { id: "shadow", label: "Shadow" },
        { id: "time", label: "Time" },
        { id: "memories", label: "Memories" },
        { id: "breath", label: "Breath" },
        { id: "sand", label: "Sand" }
      ]},
      { clue: "I speak without a mouth and hear without ears. I have no body, but I come alive with the wind.", answer: "echo", choices: [
        { id: "echo", label: "Echo" },
        { id: "whisper", label: "Whisper" },
        { id: "radio", label: "Radio" },
        { id: "ghost", label: "Ghost" },
        { id: "thunder", label: "Thunder" },
        { id: "mirror", label: "Mirror" }
      ]},
      { clue: "I'm always coming but never arrive. Today keeps chasing me, but I'm never here yet.", answer: "tomorrow", choices: [
        { id: "tomorrow", label: "Tomorrow" },
        { id: "future", label: "The Future" },
        { id: "dream", label: "A Dream" },
        { id: "sunrise", label: "Sunrise" },
        { id: "hope", label: "Hope" },
        { id: "luck", label: "Luck" }
      ]},
      { clue: "I have cities, but no houses. I have mountains, but no trees. I have water, but no fish.", answer: "map", choices: [
        { id: "map", label: "Map" },
        { id: "globe", label: "Globe" },
        { id: "painting", label: "Painting" },
        { id: "puzzle", label: "Puzzle" },
        { id: "atlas", label: "Atlas" },
        { id: "postcard", label: "Postcard" }
      ]},
      { clue: "I'm tall when I'm young and short when I'm old. What am I?", answer: "candle", choices: [
        { id: "candle", label: "Candle" },
        { id: "tree", label: "Tree" },
        { id: "person", label: "Person" },
        { id: "pencil", label: "Pencil" },
        { id: "hourglass", label: "Hourglass" },
        { id: "shadow", label: "Shadow" }
      ]},
      { clue: "I have a neck but no head, and I wear a cap. What am I?", answer: "bottle", choices: [
        { id: "bottle", label: "Bottle" },
        { id: "guitar", label: "Guitar" },
        { id: "pen", label: "Pen" },
        { id: "mushroom", label: "Mushroom" },
        { id: "vase", label: "Vase" },
        { id: "lamp", label: "Lamp" }
      ]},
      { clue: "I can be cracked, made, told, and played. What am I?", answer: "joke", choices: [
        { id: "joke", label: "Joke" },
        { id: "code", label: "Code" },
        { id: "egg", label: "Egg" },
        { id: "promise", label: "Promise" },
        { id: "record", label: "Record" },
        { id: "secret", label: "Secret" }
      ]},
      { clue: "I go all around the world but never leave my corner. What am I?", answer: "stamp", choices: [
        { id: "stamp", label: "Stamp" },
        { id: "compass", label: "Compass" },
        { id: "satellite", label: "Satellite" },
        { id: "internet", label: "Internet" },
        { id: "postcard", label: "Postcard" },
        { id: "globe", label: "Globe" }
      ]},
      { clue: "I'm light as a feather, yet the strongest person can't hold me for more than a few minutes.", answer: "breath", choices: [
        { id: "breath", label: "Breath" },
        { id: "thought", label: "Thought" },
        { id: "smoke", label: "Smoke" },
        { id: "bubble", label: "Bubble" },
        { id: "silence", label: "Silence" },
        { id: "secret", label: "Secret" }
      ]},
      { clue: "I have branches but no fruit, trunk, or leaves. What am I?", answer: "bank", choices: [
        { id: "bank", label: "Bank" },
        { id: "library", label: "Library" },
        { id: "family tree", label: "Family Tree" },
        { id: "river", label: "River" },
        { id: "company", label: "Company" },
        { id: "hospital", label: "Hospital" }
      ]},
      { clue: "I follow you everywhere, but I'm invisible until the sun comes out.", answer: "shadow", choices: [
        { id: "shadow", label: "Shadow" },
        { id: "reflection", label: "Reflection" },
        { id: "gravity", label: "Gravity" },
        { id: "echo", label: "Echo" },
        { id: "conscience", label: "Conscience" },
        { id: "past", label: "The Past" }
      ]},
      { clue: "The person who makes me doesn't want me. The person who buys me doesn't use me. The person who uses me doesn't know it.", answer: "coffin", choices: [
        { id: "coffin", label: "Coffin" },
        { id: "gift", label: "Gift" },
        { id: "medicine", label: "Medicine" },
        { id: "password", label: "Password" },
        { id: "lie", label: "Lie" },
        { id: "test", label: "Test" }
      ]},
      { clue: "I'm not alive, but I grow. I don't have lungs, but I need air. I don't have a mouth, but water kills me.", answer: "fire", choices: [
        { id: "fire", label: "Fire" },
        { id: "plant", label: "Plant" },
        { id: "cloud", label: "Cloud" },
        { id: "ice", label: "Ice" },
        { id: "rust", label: "Rust" },
        { id: "candle", label: "Candle" }
      ]},
      { clue: "I have hands but can't clap. I have a face but can't smile. What am I?", answer: "clock", choices: [
        { id: "clock", label: "Clock" },
        { id: "robot", label: "Robot" },
        { id: "statue", label: "Statue" },
        { id: "watch", label: "Watch" },
        { id: "mannequin", label: "Mannequin" },
        { id: "mirror", label: "Mirror" }
      ]}
    ];

    const happyMessages = [
      "Nailed it!",
      "Sharp thinking!",
      "Correct!",
      "You cracked it!",
      "Brain power!"
    ];

    const tryMessages = [
      "Wrong — one guess left!",
      "Not that one. Think harder!",
      "Close, but no. Try again!"
    ];

    let round = 0;
    let stars = 0;
    let currentPuzzle = null;
    let answered = false;
    let guessesLeft = GUESSES_PER_ROUND;

    const startScreen = document.getElementById("start-screen");
    const gameScreen = document.getElementById("game-screen");
    const endScreen = document.getElementById("end-screen");
    const starsEl = document.getElementById("stars");
    const roundLabel = document.getElementById("round-label");
    const clueText = document.getElementById("clue-text");
    const choicesEl = document.getElementById("choices");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const celebrationEl = document.getElementById("celebration");
    const endMessage = document.getElementById("end-message");
    const endScore = document.getElementById("end-score");
    const endEmoji = document.getElementById("end-emoji");

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRounds() {
      return shuffle(puzzles).slice(0, ROUNDS);
    }

    let gameRounds = pickRounds();

    function showScreen(screen) {
      [startScreen, gameScreen, endScreen].forEach(s => s.classList.remove("active"));
      screen.classList.add("active");
    }

    function renderStars() {
      starsEl.innerHTML = "";
      for (let i = 0; i < ROUNDS; i++) {
        const span = document.createElement("span");
        span.className = "star" + (i < stars ? " filled" : "");
        span.textContent = "⭐";
        starsEl.appendChild(span);
      }
    }

    function confetti() {
      const colors = ["#6b4ce6", "#ff85a2", "#2ecc71", "#ffd93d", "#4ecdc4"];
      for (let i = 0; i < 24; i++) {
        const bit = document.createElement("div");
        bit.className = "confetti";
        bit.style.left = Math.random() * 100 + "%";
        bit.style.top = "-10px";
        bit.style.background = colors[Math.floor(Math.random() * colors.length)];
        bit.style.animationDelay = Math.random() * 0.3 + "s";
        celebrationEl.appendChild(bit);
        setTimeout(() => bit.remove(), 1400);
      }
    }

    function updateRoundLabel() {
      roundLabel.textContent = `Round ${round + 1} of ${ROUNDS} · ${guessesLeft} guess${guessesLeft === 1 ? " left" : "es left"}`;
    }

    function finishRound(won) {
      answered = true;
      const buttons = choicesEl.querySelectorAll(".choice");
      buttons.forEach(b => { b.disabled = true; });

      if (won) {
        stars++;
        renderStars();
        feedbackEl.className = "feedback happy";
        confetti();
      } else {
        buttons.forEach(b => {
          if (b.dataset.id === currentPuzzle.answer) b.classList.add("reveal");
        });
        const answerLabel = currentPuzzle.choices.find(c => c.id === currentPuzzle.answer).label;
        feedbackEl.textContent = `Out of guesses! It was ${answerLabel}.`;
        feedbackEl.className = "feedback try-again";
      }

      nextBtn.style.display = "block";
      nextBtn.textContent = round === ROUNDS - 1 ? "See My Score!" : "Next Round";
    }

    function loadRound() {
      answered = false;
      guessesLeft = GUESSES_PER_ROUND;
      currentPuzzle = gameRounds[round];
      updateRoundLabel();
      clueText.textContent = currentPuzzle.clue;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      nextBtn.style.display = "none";

      const shuffled = shuffle(currentPuzzle.choices);
      choicesEl.innerHTML = "";

      shuffled.forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.dataset.id = choice.id;
        btn.textContent = choice.label;
        btn.addEventListener("click", () => onGuess(btn, choice.id));
        choicesEl.appendChild(btn);
      });
    }

    function onGuess(btn, id) {
      if (answered) return;

      const correct = id === currentPuzzle.answer;

      if (correct) {
        btn.classList.add("correct");
        feedbackEl.textContent = happyMessages[Math.floor(Math.random() * happyMessages.length)];
        finishRound(true);
      } else {
        guessesLeft--;
        updateRoundLabel();
        btn.classList.add("wrong");
        btn.disabled = true;
        if (guessesLeft === 0) {
          finishRound(false);
        } else {
          feedbackEl.textContent = tryMessages[Math.floor(Math.random() * tryMessages.length)];
          feedbackEl.className = "feedback try-again";
          setTimeout(() => btn.classList.remove("wrong"), 500);
        }
      }
    }

    function startGame() {
      round = 0;
      stars = 0;
      gameRounds = pickRounds();
      renderStars();
      showScreen(gameScreen);
      loadRound();
    }

    function endGame() {
      showScreen(endScreen);
      const pct = stars / ROUNDS;
      if (stars === ROUNDS) {
        endEmoji.textContent = "🏆";
        endMessage.textContent = "Perfect score — riddle master!";
      } else if (pct >= 0.75) {
        endEmoji.textContent = "🌟";
        endMessage.textContent = "Impressive! You crushed most of them.";
      } else if (pct >= 0.5) {
        endEmoji.textContent = "🧠";
        endMessage.textContent = "Solid effort. Ready for another round?";
      } else {
        endEmoji.textContent = "💪";
        endMessage.textContent = "Tough set! Study the clues and try again.";
      }
      endScore.textContent = `You solved ${stars} out of ${ROUNDS} riddles!`;
    }

    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("replay-btn").addEventListener("click", startGame);
    nextBtn.addEventListener("click", () => {
      round++;
      if (round >= ROUNDS) {
        endGame();
      } else {
        loadRound();
      }
    });

    renderStars();
  </script>
</body>
</html>
